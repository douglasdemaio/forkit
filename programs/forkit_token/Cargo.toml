[package]
name = "forkit-token"
version = "0.1.0"
description = "FORKIT SPL token, fee routing, dynamic minting, reserve management, and governance"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forkit_token"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
