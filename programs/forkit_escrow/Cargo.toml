[package]
name = "forkit-escrow"
version = "0.1.0"
description = "ForkIt escrow program — on-chain local commerce settlement on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forkit_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
forkit-registry = { path = "../forkit_registry", features = ["cpi"] }
